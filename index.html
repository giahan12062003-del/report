from pathlib import Path

html = """<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ms. Gia Hân - English Report</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;padding:20px}
.box{max-width:900px;margin:auto;background:white;border-radius:20px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{color:#5bb7c9} .pink{color:#e67aa0}
input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
button{background:#5bb7c9;color:white;border:0;padding:12px 18px;border-radius:10px;cursor:pointer}
.report{margin-top:20px;border:2px solid #dce8eb;border-radius:20px;padding:25px;background:linear-gradient(135deg,#f4fbfc,#fff7fa)}
</style>
</head>
<body>
<div class="box">
<h1>Teacher Report <span class="pink">Ms. Gia Hân</span></h1>
<input id="name" placeholder="Tên học sinh">
<input id="class" placeholder="Lớp">
<input id="lesson" placeholder="Bài học">
<textarea id="comment" placeholder="Nhận xét"></textarea>
<button onclick="create()">Tạo phiếu</button>
<button onclick="window.print()">Xuất PDF</button>

<div class="report" id="r">
<h2 id="n">Student</h2>
<p><b>Class:</b> <span id="c">-</span></p>
<p><b>Lesson:</b> <span id="l">-</span></p>
<p><b>Teacher's Feedback</b></p>
<p id="cm">-</p>
<p style="text-align:right;color:#e67aa0"><b>Ms. Gia Hân</b></p>
</div>
</div>
<script>
function create(){
n.textContent=name.value||"Student";
c.textContent=document.getElementById('class').value;
l.textContent=lesson.value;
cm.textContent=comment.value;
}
</script>
</body>
</html>"""

path = Path("/mnt/data/index.html")
path.write_text(html, encoding="utf-8")
print(str(path))
